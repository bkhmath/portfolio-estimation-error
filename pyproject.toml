[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-estimation-error"
version = "1.0.0"
description = "Why mean-variance optimisation fails out of sample, diagnosed with random matrix theory and repaired with convex optimisation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bkhmath" }]
keywords = [
    "quantitative-finance",
    "random-matrix-theory",
    "marchenko-pastur",
    "covariance-estimation",
    "portfolio-optimisation",
    "convex-optimization",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "cvxpy>=1.4",
    "requests>=2.31",
]

[project.optional-dependencies]
# scikit-learn is a test-only dependency: it provides the independent
# Ledoit-Wolf implementation that tests/test_estimators.py checks against.
dev = ["pytest>=7.4", "ruff>=0.4", "scikit-learn>=1.3"]

[project.urls]
Repository = "https://github.com/bkhmath/portfolio-estimation-error"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = ["slow: end-to-end runs of the study script"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are the formatter's business, not the linter's
    "RUF001",  # ambiguous unicode in prose docstrings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SLF001"]
