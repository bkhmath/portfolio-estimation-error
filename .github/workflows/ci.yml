name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        # The whole suite runs on simulated data and on a synthetic copy of the
        # Kenneth French file format, so CI needs no network access and no data
        # cache.  Nothing here downloads anything.
        run: pytest

      - name: Run the simulated study end to end
        # Proves the pipeline works on a clean checkout, which is what a reader
        # cloning the repository will do before they run `make data`.
        run: |
          python scripts/run_study.py --simulated --quick --out /tmp/ci-reports
          test -f /tmp/ci-reports/manifest.json
          test -f /tmp/ci-reports/figures/predicted_vs_realised.png
          test -f /tmp/ci-reports/figures/mp_spectrum_simulated.png
